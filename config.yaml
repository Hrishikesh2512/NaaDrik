# Naadrik configuration. Every mapping parameter lives here.
# Coordinates: x, y are normalised image coordinates in [0, 1], origin top-left.
# Distance is normalised to [0, 1]: 0 = nearest, 1 = farthest.
# Colour channels are in [0, 1].

audio:
  sample_rate: 48000
  block_size: 256          # frames per audio callback (~5.3 ms at 48 kHz)
  master_gain: 0.75        # leaves a single white object (presence + 3 instruments) below the limiter
  device: null             # null = system default output; or a sounddevice name / index
  live_latency_s: 0.03     # output buffer for live mode; headroom against Python thread contention

pitch:
  base_hz: 196.0           # G3, lowest note (bottom of frame)
  octaves: 2.5
  scale: [0, 2, 4, 7, 9]   # major pentatonic, semitones above each octave root

pulse:
  near_hz: 8.0             # pulse rate at distance 0
  far_hz: 1.0              # pulse rate at distance 1 (log-interpolated in between)
  duty_cycle: 0.5          # fraction of each pulse period the note sounds
  max_gate_s: 0.35         # cap so slow pulses stay short beeps rather than drones
  attack_ms: 2.0
  release_ms: 25.0

colour:
  thresholds: [0.25, 0.6]  # channel boundaries: below first = off, below second = low, else high
  levels: [0.0, 0.35, 1.0] # instrument gain for off / low / high
  central_fraction: 0.5    # sample colour from the central part of each box to avoid background
  white_balance: true      # grey-world white balance and exposure normalisation before quantising

instruments:
  note_duration_s: 1.0     # length of each pre-rendered note; must exceed max_gate_s + release
  pluck:                   # red: sitar-like plucked string (Karplus-Strong)
    gain: 1.0
    decay_s: 0.9           # time for the string to fall by 60 dB
    brightness: 0.7        # 0 = dull excitation, 1 = bright
    buzz: 0.35             # jawari-style bridge buzz
    drive: 2.0             # tanh saturation; tames the attack peak and adds upper harmonics
    sympathetic: 0.12      # level of the octave sympathetic string
  bowed:                   # green: violin-like bowed string
    gain: 0.9
    vibrato_hz: 5.5
    vibrato_cents: 15.0
    vibrato_delay_s: 0.12
    cutoff_hz: 6000.0
    body_resonances_hz: [290.0, 520.0, 2900.0]
    bow_noise: 0.03
  presence:                # every object: a soft neutral hum so no object is ever silent
    level: 0.25            # gain relative to a 'high' colour instrument (1.0); must be > 0
    cutoff_ratio: 2.5      # low-pass cutoff as a multiple of the note's pitch (lower = more muted)
    noise: 0.35            # share of band-limited noise around the pitch, for a hum-like texture
  flute:                   # blue: flute (sine partials + breath)
    gain: 0.9
    harmonics: [1.0, 0.25, 0.08]
    breath: 0.06
    chiff: 0.25            # onset noise burst level
    vibrato_hz: 4.8
    vibrato_cents: 8.0
    tremolo_depth: 0.08

spatial:
  mode: head_model         # head_model (ITD + spherical-head shadow) | pan (ITD + constant-power ILD)
  max_azimuth_deg: 80.0    # azimuth at the frame edges; wider than the lens so positions separate clearly
  head_radius_m: 0.0875
  extra_ild_db: 9.0        # broadband level difference at 90 deg, on top of the head model, so low notes lateralise too
  rear_lowpass_hz: 3500.0  # extra darkening for sources behind the listener
  smoothing_ms: 60.0       # glide time constant for azimuth and pulse rate

objects:
  max_objects: 3

camera:
  index: 0
  capture_width: 640
  capture_height: 480
  fps: 30
  process_width: 320       # frames are resized to this width before any processing

detection:
  model_path: models/efficientdet_lite0.tflite
  score_threshold: 0.4
  max_results: 10

depth:
  model_path: models/depth_anything_v2_small.onnx
  every_n_frames: 4        # depth is slow; run it on every Nth frame and reuse the latest map
  input_width: 336         # model input width, multiple of 14 (height keeps the aspect ratio)
  threads: 2
  box_fraction: 0.6        # median depth over the central part of each box
  normalisation: scene     # scene (relative to the current frame) | calibrated (`naadrik calibrate`)
  calibration_path: calibration.yaml
  levels: 3                # 0 = continuous distance; 3 = near / mid / far
  hysteresis: 0.08         # margin before a quantised distance level changes

tracking:
  iou_threshold: 0.3
  max_missed_frames: 8     # keep a track alive through brief detector dropouts
  min_hits: 2              # frames a track must be seen before it can sound
  position_smoothing: 0.4  # weight of each new measurement (1 = no smoothing)
  distance_smoothing: 0.3
  colour_smoothing: 0.3    # steadies colour so quantised instrument levels do not flicker

priority:                  # score = closeness x importance x centredness x motion boost
  class_importance:
    person: 1.0
    car: 1.0
    bus: 1.0
    truck: 1.0
    motorcycle: 1.0
    bicycle: 0.9
    dog: 0.8
    cat: 0.6
    chair: 0.7
    bench: 0.6
    couch: 0.6
    dining table: 0.6
    bed: 0.5
    door: 0.8
    stop sign: 0.8
    traffic light: 0.8
    fire hydrant: 0.6
    bottle: 0.4
    cup: 0.4
    cell phone: 0.4
    laptop: 0.4
  default_importance: 0.5
  centre_weight: 0.5       # 0 = position ignored; 1 = objects at the frame edge score zero
  motion_boost: 0.5        # extra weight for objects moving or approaching
  approach_speed: 0.15     # distance units per second that count as approaching
  moving_speed: 0.25       # frame widths per second that count as moving
  switch_margin: 0.15      # a new object must beat a sounding one by this much to replace it

training:
  tts_command: espeak-ng   # offline text-to-speech executable
  voice: en
  words_per_minute: 170
  speech_gain: 0.9
  spatialise_speech: true  # speak each label from its object's direction
  duck_db: 12.0            # other sounds drop by this much while speech plays
  gap_s: 0.15              # pause between a spoken label and its object's sound
  repeat_s: 20.0           # announce a still-sounding object again after this long
  include_height: false    # add "high" / "low" to labels
  full_speech_sessions: 3  # sessions in which every object is announced
  fade_sessions: 5         # then the chance of announcing falls linearly to zero
  progress_path: null      # null = user data directory (~/.local/share/naadrik/training.yaml)

study:
  stimulus_s: 3.0          # each stimulus plays this long (3 sweeps for the baseline sonifier)
  colours: [red, green, blue, yellow, white]
  baseline_trials: 9       # no explanation, no feedback
  training_trials: 27      # explanation and feedback after every response
  test_trials: 27          # no feedback
  results_dir: results
  baseline_sonifier:       # modelled on the classic vOICe image-to-sound mapping
    sweep_s: 1.0           # left-to-right scan time
    rows: 32               # image rows, one sine each
    columns: 64
    low_hz: 500.0          # bottom row
    high_hz: 5000.0        # top row (exponential spacing)
    greyscale: luma        # luma (0.299 R + 0.587 G + 0.114 B) | mean
    click: true            # tick at the start of each sweep
